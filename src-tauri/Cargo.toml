[package]
name = "streamgrab"
version = "0.6.3"
description = "M3U8 Video Stream Downloader"
authors = ["StreamGrab Team"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "streamgrab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.0", features = ["tray-icon"] }
image = "0.25"
tauri-plugin-log = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-notification = "2"

# 异步运行时
tokio = { version = "1", features = ["full"] }

# UUID 生成
uuid = { version = "1.0", features = ["v4", "serde"] }

# 正则表达式
regex = "1.10"

# 系统目录
dirs = "5.0"

# 时间处理
chrono = { version = "0.4", features = ["serde"] }

# 错误处理
thiserror = "1.0"
anyhow = "1.0"

# 延迟初始化
once_cell = "1.19"

# 并发 Map
dashmap = "6.1"

# SQLite 数据库
rusqlite = { version = "0.31", features = ["bundled"] }

# TOML 配置解析
toml = "0.8"

# 字符编码处理 (Windows GBK 支持)
encoding_rs = "0.8"

# HTTP 客户端
reqwest = { version = "0.12", features = ["json", "stream"] }

# SHA-256 完整性校验
sha2 = "0.10"

# Base64（FFmpeg basic 认证 Authorization 头）
base64 = "0.22"

# ZIP 解压
zip = "2"

# 查找可执行文件
which = "7"

[dev-dependencies]
tempfile = "3"
