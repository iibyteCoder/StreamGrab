[package]
name = "streamgrab"
version = "0.1.0"
description = "M3U8 Video Stream Downloader"
authors = ["StreamGrab Team"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "streamgrab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.0", features = [] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"

# 异步运行时
tokio = { version = "1", features = ["full"] }

# UUID 生成
uuid = { version = "1.0", features = ["v4", "serde"] }

# 正则表达式
regex = "1.10"

# 系统目录
dirs = "5.0"

# 时间处理
chrono = { version = "0.4", features = ["serde"] }

# 错误处理
thiserror = "1.0"
anyhow = "1.0"

# 延迟初始化
once_cell = "1.19"

# SQLite 数据库
rusqlite = { version = "0.31", features = ["bundled"] }
